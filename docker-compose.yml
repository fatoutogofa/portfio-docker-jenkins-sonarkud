services:

  # ─────────────────────────────────────────────
  # Jenkins CI/CD
  # ─────────────────────────────────────────────
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - "8080:8080"     # Interface web Jenkins
      - "50000:50000"   # Agents Jenkins
    volumes:
      - jenkins_home:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Backend Node.js / Express
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./DOCKER-main
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://babijou8_db_user:fFQ5o8JR94spCmF7@cluster0.vsshvby.mongodb.net/
      - PORT=5000
    restart: always

  # ─────────────────────────────────────────────
  # Frontend React / Nginx
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./portfolio-spa-main
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  jenkins_home:
