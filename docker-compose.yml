services:

  # ─────────────────────────────────────────────
  # Jenkins CI/CD
  # ─────────────────────────────────────────────
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    restart: unless-stopped
    networks:
      - devops-net

  # ─────────────────────────────────────────────
  # SonarQube — Analyse de code
  # ─────────────────────────────────────────────
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - devops-net

  # ─────────────────────────────────────────────
  # Backend Node.js / Express
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./DOCKER-main
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://babijou8_db_user:D9iwsRZ5tckatyEo@mongodb.aio8c4i.mongodb.net/?appName=mongodb
      - PORT=5000
    restart: always
    networks:
      - devops-net

  # ─────────────────────────────────────────────
  # Frontend React / Nginx
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./portfolio-spa-main
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - devops-net

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  devops-net:
    driver: bridge
