groups:
  - name: portfolio-alerts
    rules:

      # Alerte si le backend ne répond plus
      - alert: BackendDown
        expr: up{job="portfolio-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend portfolio inaccessible"
          description: "Le backend n'expose plus de métriques depuis 1 minute."

      # Alerte si la latence dépasse 2 secondes
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée sur le backend"
          description: "95% des requêtes prennent plus de 2 secondes."

      # Alerte si CPU > 80%
      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU élevé"
          description: "Utilisation CPU supérieure à 80% depuis 5 minutes."

      # Alerte si RAM > 85%
      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire RAM élevée"
          description: "Utilisation RAM supérieure à 85%."
