global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:

  # Prometheus se surveille lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend Node.js — métriques applicatives
  - job_name: 'portfolio-backend'
    static_configs:
      - targets: ['portfolio-backend:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter — CPU, RAM, disque, réseau
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # SonarQube — disponibilité (health check)
  - job_name: 'sonarqube'
    static_configs:
      - targets: ['sonarqube:9000']
    metrics_path: '/api/monitoring/metrics'
    scrape_interval: 30s

  # Jenkins — disponibilité (nécessite plugin Prometheus dans Jenkins)
  - job_name: 'jenkins'
    static_configs:
      - targets: ['jenkins:8080']
    metrics_path: '/prometheus'
    scrape_interval: 30s

  # Frontend Nginx — disponibilité
  - job_name: 'portfolio-frontend'
    static_configs:
      - targets: ['portfolio-frontend:80']
    metrics_path: '/'
    scrape_interval: 30s
